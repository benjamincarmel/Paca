￼
}
￼
},
"deploy": {
￼
￼
"environment": {
￼
"url": "{{ steps.deployment.outputs.page_url }}"
},
"steps": [
{
"name": "Deploy web flasher to GitHub Pages",
"id": "deployment",
"uses": "actions/deploy-pages@v4"
}
]
}
}
}
