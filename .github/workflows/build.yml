{
"name": "Build Paca Firmware",
"on": {
"push": { "branches": ["main", "master"] },
"workflow_dispatch": {}
},
"permissions": {
"contents": "read",
"pages": "write",
"id-token": "write"
},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{ "uses": "actions/checkout@v4" },
{ "uses": "actions/setup-python@v5", "with": { "python-version": "3.11" } },
{ "uses": "arduino/setup-arduino-cli@v2" },
{ "run": "python3 -m pip install pillow esptool" },
{ "run": "python3 build.py" },
{
"uses": "actions/upload-artifact@v4",
"with": { "name": "paca-sticks3-firmware", "path": "out/paca-sticks3-merged.bin" }
},
{ "uses": "actions/upload-pages-artifact@v3", "with": { "path": "site" } }
]
},
"deploy": {
"needs": "build",
"runs-on": "ubuntu-latest",
"environment": {
"name": "github-pages",
"url": "${{ steps.deployment.outputs.page_url }}"
},
"steps": [
{ "id": "deployment", "uses": "actions/deploy-pages@v4" }
]
}
}
}
